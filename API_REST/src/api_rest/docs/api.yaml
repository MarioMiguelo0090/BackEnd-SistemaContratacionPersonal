openapi: 3.0.3
info:
  title: Mi API
  version: 1.0.0

paths:
  
  /acceso/login:
    post:
      tags: [Acceso]
      summary: Iniciar sesión
      description: Autentica al usuario y establece una cookie HTTP-only con el token JWT (access_token) con duración de 8 horas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - contrasenia
              properties:
                usuario:
                  type: string
                  description: Solo letras y números. Campo requerido.
                  example: jperez
                contrasenia:
                  type: string
                  format: password
                  description: Mínimo 8 caracteres, máximo 64. Campo requerido.
                  minLength: 8
                  maxLength: 64
                  example: MiContrasenia123*
      responses:
        '200':
          description: Inicio de sesión correcto
          headers:
            Set-Cookie:
              description: Cookie HTTP-only con el token JWT. Nombre access_token, expira en 8 horas, Secure, SameSite=None.
              schema:
                type: string
                example: access_token=eyJhbGci...; HttpOnly; Secure; SameSite=None
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: string
                    example: "Inicio de sesión correcto"
        '400':
          description: Datos de inicio de sesión inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 400
                  mensaje:
                    type: string
                    example: "Datos de inicio de sesión inválidos"
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 401
                  mensaje:
                    type: string
                    example: "Credenciales inválidas"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 500
                  mensaje:
                    type: string
                    example: "Ha ocurrido un error en el servidor"

  /acceso/logout:
    delete:
      tags: [Acceso]
      summary: Cerrar sesión
      description: Elimina la cookie access_token del usuario autenticado.
      responses:
        '200':
          description: Sesión cerrada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: string
                    example: "Sesión cerrada de manera correcta."
        '404':
          description: No se encontró sesión activa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 404
                  mensaje:
                    type: string
                    example: "No se ha podido encontrar la sesión a cerrar"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 500
                  mensaje:
                    type: string
                    example: "Ha ocurrido un error al intentar cerrar la sesión."

  /acceso/sesion:
    get:
      tags: [Acceso]
      summary: Obtener sesión activa
      description: Obtener la sesión activa si es que la existe de un usuario. Requiere autenticación JWT mediante cookie access_token.
      responses: 
        '200':
          description: Sesión obtenida de manera exitosa
          content: 
            application/json:
              schema: 
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado: 
                    type: integer
                    example: 200
                  mensaje:
                    type: object
                    properties: 
                      tipoDeAcceso:
                        type: integer
                        example: 1
                      usuario:
                        type: string
                        example: Administrador
        '401':
          description: No hay una sesión activa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 401
                  mensaje:
                    type: string
                    example: "No se ha encontrado una sesión activa. Por favor inicie sesión de nuevo."
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 500
                  mensaje:
                    type: string
                    example: "Ha ocurrido un error al intentar obtener la sesión activa"

  /acceso/:
    post:
      tags: [Acceso]
      summary: Registrar nueva cuenta de acceso
      description: Crea una nueva cuenta de usuario. Requiere autenticación JWT mediante cookie access_token.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - contrasenia
                - FKIdTipoAcceso
                - nombre
                - primerApellido
              properties:
                usuario:
                  type: string
                  description: Solo letras y números. Campo requerido.
                  example: jperez
                contrasenia:
                  type: string
                  format: password
                  description: Mínimo 8 caracteres, máximo 64. Campo requerido.
                  minLength: 8
                  maxLength: 64
                  example: MiContrasenia123
                FKIdTipoAcceso:
                  type: number
                  description: ID del tipo de acceso. Campo requerido.
                  example: 2
                nombre:
                  type: string
                  description: Solo letras. Mínimo 1 carácter, máximo 80. Campo requerido.
                  minLength: 1
                  maxLength: 80
                  example: Juan
                primerApellido:
                  type: string
                  description: Solo letras. Mínimo 1 carácter, máximo 80. Campo requerido.
                  minLength: 1
                  maxLength: 80
                  example: Pérez
                segundoApellido:
                  type: string
                  description: Solo letras. Mínimo 1 carácter, máximo 80. Opcional.
                  minLength: 1
                  maxLength: 80
                  example: García
      responses:
        '200':
          description: Registro exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: string
                    example: "Registro exitoso"
        '400':
          description: Datos con formato inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 400
                  mensaje:
                    type: string
                    example: "Datos con formato inválido, por favor verifique los datos enviados."
        '409':
          description: El nombre de usuario ya existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 409
                  mensaje:
                    type: string
                    example: "El usuario ya se encuentra registrado"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 500
                  mensaje:
                    type: string
                    example: "Ha ocurrido un error al intentar realizar el registro de Acceso."

