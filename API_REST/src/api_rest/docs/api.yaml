                  mensaje:
                    type: string
                    example: "Ha ocurrido un error al intentar cerrar la sesión."

  /acceso/:
    post:
      tags: [Acceso]
      summary: Registrar nueva cuenta de acceso
      description: Crea una nueva cuenta de usuario. Requiere autenticación JWT mediante cookie access_token.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - contrasenia
                - FKIdTipoAcceso
                - nombre
                - primerApellido
              properties:
                usuario:
                  type: string
                  description: Solo letras y números. Campo requerido.
                  example: jperez
                contrasenia:
                  type: string
                  format: password
                  description: Mínimo 8 caracteres, máximo 64. Campo requerido.
                  minLength: 8
                  maxLength: 64
                  example: MiContrasenia123
                FKIdTipoAcceso:
                  type: number
                  description: ID del tipo de acceso. Campo requerido.
                  example: 2
                nombre:
                  type: string
                  description: Solo letras. Mínimo 1 carácter, máximo 80. Campo requerido.
                  minLength: 1
                  maxLength: 80
                  example: Juan
                primerApellido:
                  type: string
                  description: Solo letras. Mínimo 1 carácter, máximo 80. Campo requerido.
                  minLength: 1
                  maxLength: 80
                  example: Pérez
                segundoApellido:
                  type: string
                  description: Solo letras. Mínimo 1 carácter, máximo 80. Opcional.
                  minLength: 1
                  maxLength: 80
                  example: García
      responses:
        '200':
          description: Registro exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: string
                    example: "Registro exitoso"
        '400':
          description: Datos con formato inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 400
                  mensaje:
                    type: string
                    example: "Datos con formato inválido, por favor verifique los datos enviados."
        '409':
          description: El nombre de usuario ya existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 409
                  mensaje:
                    type: string
                    example: "El usuario ya se encuentra registrado"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 500
                  mensaje:
                    type: string
                    example: "Ha ocurrido un error al intentar realizar el registro de Acceso."

