openapi: 3.0.3
info:
  title: Mi API
  version: 1.0.0

paths:
  
  /acceso/login:
    post:
      tags: [Acceso]
      summary: Iniciar sesión
      description: Autentica al usuario y establece una cookie HTTP-only con el token JWT (access_token) con duración de 8 horas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - contrasenia
              properties:
                usuario:
                  type: string
                  description: Solo letras y números. Campo requerido.
                  example: jperez
                contrasenia:
                  type: string
                  format: password
                  description: Mínimo 8 caracteres, máximo 64. Campo requerido.
                  minLength: 8
                  maxLength: 64
                  example: MiContrasenia123*
      responses:
        '200':
          description: Inicio de sesión correcto
          headers:
            Set-Cookie:
              description: Cookie HTTP-only con el token JWT. Nombre access_token, expira en 8 horas, Secure, SameSite=None.
              schema:
                type: string
                example: access_token=eyJhbGci...; HttpOnly; Secure; SameSite=None
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: string
                    example: "Inicio de sesión correcto"
        '400':
          description: Datos de inicio de sesión inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 400
                  mensaje:
                    type: string
                    example: "Datos de inicio de sesión inválidos"
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 401
                  mensaje:
                    type: string
                    example: "Credenciales inválidas"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 500
                  mensaje:
                    type: string
                    example: "Ha ocurrido un error en el servidor"

  /acceso/logout:
    delete:
      tags: [Acceso]
      summary: Cerrar sesión
      description: Elimina la cookie access_token del usuario autenticado.
      responses:
        '200':
          description: Sesión cerrada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: string
                    example: "Sesión cerrada de manera correcta."
        '404':
          description: No se encontró sesión activa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 404
                  mensaje:
                    type: string
                    example: "No se ha podido encontrar la sesión a cerrar"
        '500':
          description: Error interno del servidor
          content:
            application/json:
