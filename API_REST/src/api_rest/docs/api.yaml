  /cedula/:
    post:
      tags: [Cédula]
      summary: Insertar nueva cédula
      description: Registra una nueva cédula en el sistema. Requiere autenticación JWT mediante cookie access_token.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                FKIdTipoCedula:
                  type: integer
                  nullable: true
                  example: 1
                FKIdProceso:
                  type: integer
                  nullable: true
                  example: 10
                fechaCedulaInterna:
                  type: string
                  example: "2024-01-15"
                fechaCedulaResultados:
                  type: string
                  example: "2024-01-20"
                edad:
                  type: string
                  maxLength: 3
                  example: "28"
                educacionFormal:
                  type: string
                  example: "Licenciatura en Administración"
                referidoPor:
                  type: string
                  example: "Juan Pérez"
                antecedentesFamiliaresUV:
                  type: string
                  example: "Ninguno"
                expectativaLaboral:
                  type: string
                  example: "Crecimiento profesional"
                experienciaRelacionada:
                  type: string
                  example: "3 años en puesto similar"
                experiencia:
                  type: string
                  example: "Descripción de experiencia general"
                conclusiones:
                  type: string
                  example: "Candidato apto para el puesto"
                resultado:
                  type: string
                  maxLength: 50
                  example: "Aprobado"
                efectoContratacion:
                  type: string
                  example: "Contratación definitiva"
                competenciaReforzar:
                  type: string
                  example: "Liderazgo"
                competenciaDesarrollar:
                  type: string
                  example: "Comunicación"
                FKIdClasificacionCedula:
                  type: integer
                  nullable: true
                  example: 2
                FKIdResultado:
                  type: integer
                  nullable: true
                  example: 3
                motivoCedulaInterna:
                  type: string
                  example: "Vacante por jubilación"
                motivoCedulaResultados:
                  type: string
                  example: "Evaluación psicométrica completada"
                puesto:
                  type: string
                  example: "Analista de RRHH"
                competenciasSobresaliente:
                  type: string
                  example: "Trabajo en equipo"
                descripcionDesarrollar:
                  type: string
                  example: "Desarrollar habilidades de negociación"
                descripcionReforzar:
                  type: string
                  example: "Reforzar orientación al servicio"
                plaza:
                  type: string
                  example: "Plaza 001"
                oficioAutorizacionDeOcupacion:
                  type: string
                  example: "Oficio-2024-001"
                evaluacionConocimientos:
                  type: string
                  example: "85/100"
                aprobadoJefeOficina:
                  type: boolean
                  example: true
                aprobadoDireccion:
                  type: boolean
                  example: false
                archivoAdjunto:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Cédula registrada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: string
                    example: "La cédula ha sido registrada"
                  idCedula:
                    type: integer
                    example: 45
        '400':
          description: Datos con formato inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 400
                  mensaje:
                    type: string
                    example: "Datos con formato inválido, por favor verifique los datos enviados."
        '409':
          description: La cédula ya existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 409
                  mensaje:
                    type: string
                    example: "El registro que intenta realizar ya existe en el sistema"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 500
                  mensaje:
                    type: string
                    example: "Ha ocurrido un error en el servidor"

