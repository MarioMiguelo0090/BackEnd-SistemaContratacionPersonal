                  format: password
                  description: Mínimo 8 caracteres, máximo 64.
                  minLength: 8
                  maxLength: 64
                  example: NuevaContrasenia456
                FKIdTipoAcceso:
                  type: number
                  description: ID del tipo de acceso.
                  example: 2
                nombre:
                  type: string
                  description: Solo letras. Mínimo 1 carácter, máximo 80.
                  minLength: 1
                  maxLength: 80
                  example: Juan
                primerApellido:
                  type: string
                  description: Solo letras. Mínimo 1 carácter, máximo 80.
                  minLength: 1
                  maxLength: 80
                  example: Pérez
                segundoApellido:
                  type: string
                  description: Solo letras. Mínimo 1 carácter, máximo 80. Opcional.
                  minLength: 1
                  maxLength: 80
                  example: García
                estado:
                  type: integer
                  description: Estado de la cuenta. Acepta booleano o entero entre 0 y 1.
                  minimum: 0
                  maximum: 1
                  example: 1
      responses:
