    get:
      tags: [Proceso de Contratación]
      summary: Obtener datos del analista para estadística
      description: Retorna los procesos de un analista con datos adicionales de nombre y apellidos para estadísticas. Requiere autenticación JWT mediante cookie access_token.
      security:
        - cookieAuth: []
      parameters:
        - name: FKIdAcceso
          in: path
          required: true
          schema:
            type: integer
          description: ID del acceso (analista) para obtener estadísticas.
          example: 5
      responses:
        '200':
          description: Evaluaciones del analista obtenidas correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: object
                    properties:
                      evaluacionesAnalista:
                        type: array
                        items:
                          type: object
                          properties:
                            idProceso:
                              type: integer
                              example: 10
                            folio:
                              type: string
                              example: "FOL-001"
                            nombre:
                              type: string
                              example: "Juan"
                            primerApellido:
                              type: string
                              example: "Pérez"
                            segundoApellido:
                              type: string
                              example: "García"
                            FKIdAcceso:
                              type: integer
                              example: 5
