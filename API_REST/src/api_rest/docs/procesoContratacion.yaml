
  /proceso-contratacion/:
    post:
      tags: [Proceso de Contratación]
      summary: Registrar nuevo proceso de contratación
      description: Registra un nuevo proceso de contratación. Requiere autenticación JWT mediante cookie access_token.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folio:
                  type: string
                  description: Folio del proceso. Texto válido.
                numPlaza:
                  type: string
                  description: Número de plaza. Máximo 10 caracteres.
                  maxLength: 10
                fechaRecibido:
                  type: string
                  description: Fecha de recibido.
                fechaEntrevista:
                  type: string
                  description: Fecha de entrevista.
                resultadoEvaluacionConocimiento:
                  type: string
                  description: Resultado de evaluación de conocimiento.
                fechaEnvioDEyDP:
                  type: string
                  description: Fecha de envío DEyDP.
                fechaNotificacion:
                  type: string
                  description: Fecha de notificación.
                categoriaPuestoOrigen:
                  type: string
                  description: Categoría (puesto/origen). Máximo 8000 caracteres.
                  maxLength: 8000
                diasProceso:
                  type: string
                  description: Días de proceso. Máximo 3 caracteres.
                  maxLength: 3
                beneficiado:
                  type: boolean
                  description: Indica si el candidato fue beneficiado.
                FKIdTipoProceso:
                  type: integer
                  nullable: true
                  description: ID del tipo de proceso.
                FKIdTipoPersonal:
                  type: integer
                  nullable: true
                  description: ID del tipo de personal.
                FKIdEstadoProcesoContratacion:
                  type: integer
                  nullable: true
                  description: ID del estado del proceso de contratación.
                FKIdTemporalDefinitiva:
                  type: integer
                  nullable: true
                  description: ID de temporal/definitiva.
                FKIdDependencia:
                  type: integer
                  nullable: true
                  description: ID de la dependencia.
                hermesNotificacion:
                  type: string
                  description: Hermes de notificación.
                titularPlaza:
                  type: string
                  description: Titular de la plaza.
                lineamientoOficioContinuidad:
                  type: string
                  description: Lineamiento de oficio continuidad.
                motivo:
                  type: string
                  description: Motivo del proceso.
                fechaElaboracionPropuesta:
                  type: string
                  description: Fecha de elaboración de propuesta.
                fechaLiberacionOficio:
                  type: string
                  description: Fecha de liberación de oficio.
                periodoAutorizadoOficioInicio:
                  type: string
                  description: Inicio del período autorizado del oficio. Máximo 50 caracteres.
                  maxLength: 50
                periodoAutorizadoOficioFin:
                  type: string
                  description: Fin del período autorizado del oficio. Máximo 50 caracteres.
                  maxLength: 50
                categoriaAutorizadaOficio:
                  type: string
                  description: Categoría autorizada del oficio.
                observaciones:
                  type: string
                  description: Observaciones del proceso.
                numCarpeta:
                  type: string
                  description: Número de carpeta. Máximo 10 caracteres.
                  maxLength: 10
                nombreCandidato:
                  type: string
                  description: Nombre del candidato. Máximo 100 caracteres.
                  maxLength: 100
                funcionDesempeniar:
                  type: string
                  description: Función a desempeñar.
                familiaFuncional:
                  type: string
                  description: Familia funcional.
                fechaEvaluacionCompetencias:
                  type: string
                  description: Fecha de evaluación de competencias.
                fechaInicioProcesamiento:
                  type: string
                  description: Fecha de inicio de procesamiento.
                resultadoEvaluacionCompetencias:
                  type: string
                  description: Resultado de evaluación de competencias. Máximo 6 caracteres.
                  maxLength: 6
                experienciaLaboralSolicitada:
                  type: string
                  description: Experiencia laboral solicitada. Máximo 50 caracteres.
                  maxLength: 50
                resultadoReferenciasLaborales:
                  type: string
                  description: Resultado de referencias laborales. Máximo 50 caracteres.
                  maxLength: 50
                fechaEnvioEvaluacionDesempenio:
                  type: string
                  description: Fecha de envío de evaluación de desempeño.
                resultadoHabilidadesWord:
                  type: string
                  description: Resultado de habilidades de Word. Máximo 5 caracteres.
                  maxLength: 5
                resultadoHabilidadesExcel:
                  type: string
                  description: Resultado de habilidades de Excel. Máximo 5 caracteres.
                  maxLength: 5
                resultadoOrtografia:
                  type: string
                  description: Resultado de ortografía. Máximo 5 caracteres.
                  maxLength: 5
                resultadoProcesoEvaluacion:
                  type: string
                  description: Resultado del proceso de evaluación. Máximo 50 caracteres.
                  maxLength: 50
                fechaRevisionOfiEval:
                  type: string
                  description: Fecha de revisión de oficio de evaluación.
                observacionesAnalista:
                  type: string
                  description: Observaciones del analista.
                consecutivoExpediente:
                  type: string
                  description: Consecutivo de expediente. Máximo 10 caracteres.
                  maxLength: 10
                resultadoSeguimientoEvaluacionDesempenio:
                  type: string
                  description: Resultado de seguimiento de evaluación de desempeño. Máximo 10 caracteres.
                  maxLength: 10
                FKIdAcceso:
                  type: integer
                  nullable: true
                  description: ID del usuario analista asignado.
                autorizacion:
                  type: boolean
                  description: Indica si el proceso fue autorizado.
      responses:
        '200':
          description: Proceso de contratación registrado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: string
                    example: "Registro exitoso"
        '400':
          description: Datos con formato inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 400
                  mensaje:
                    type: string
                    example: "Datos con formato inválido, por favor verifique los datos enviados."
        '409':
          description: El registro ya existe en el sistema
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 409
                  mensaje:
                    type: string
                    example: "El registro que intenta realizar ya existe en el sistema"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 500
                  mensaje:
                    type: string
                    example: "Ha ocurrido un error en el servidor"

  /proceso-contratacion/{idProceso}:
    put:
      tags: [Proceso de Contratación]
      summary: Editar proceso de contratación existente
      description: Edita los datos de un proceso de contratación. Todos los campos del body son opcionales (edición parcial con .partial()). Requiere autenticación JWT mediante cookie access_token.
      security:
        - cookieAuth: []
      parameters:
        - name: idProceso
          in: path
          required: true
          schema:
            type: integer
          description: ID del proceso de contratación a editar.
          example: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folio:
                  type: string
                numPlaza:
                  type: string
                  maxLength: 10
                fechaRecibido:
                  type: string
                fechaEntrevista:
                  type: string
                resultadoEvaluacionConocimiento:
                  type: string
                fechaEnvioDEyDP:
                  type: string
                fechaNotificacion:
                  type: string
                categoriaPuestoOrigen:
                  type: string
                  maxLength: 8000
                diasProceso:
                  type: string
                  maxLength: 3
                beneficiado:
                  type: boolean
                FKIdTipoProceso:
                  type: integer
                  nullable: true
                FKIdTipoPersonal:
                  type: integer
                  nullable: true
                FKIdEstadoProcesoContratacion:
                  type: integer
                  nullable: true
                FKIdTemporalDefinitiva:
                  type: integer
                  nullable: true
                FKIdDependencia:
                  type: integer
                  nullable: true
                hermesNotificacion:
                  type: string
                titularPlaza:
                  type: string
                lineamientoOficioContinuidad:
                  type: string
                motivo:
                  type: string
                fechaElaboracionPropuesta:
                  type: string
                fechaLiberacionOficio:
                  type: string
                periodoAutorizadoOficioInicio:
                  type: string
                  maxLength: 50
                periodoAutorizadoOficioFin:
                  type: string
                  maxLength: 50
                categoriaAutorizadaOficio:
                  type: string
                observaciones:
                  type: string
                numCarpeta:
                  type: string
                  maxLength: 10
                nombreCandidato:
                  type: string
                  maxLength: 100
                funcionDesempeniar:
                  type: string
                familiaFuncional:
                  type: string
                fechaEvaluacionCompetencias:
                  type: string
                fechaInicioProcesamiento:
                  type: string
                resultadoEvaluacionCompetencias:
                  type: string
                  maxLength: 6
                experienciaLaboralSolicitada:
                  type: string
                  maxLength: 50
                resultadoReferenciasLaborales:
                  type: string
                  maxLength: 50
                fechaEnvioEvaluacionDesempenio:
                  type: string
                resultadoHabilidadesWord:
                  type: string
                  maxLength: 5
                resultadoHabilidadesExcel:
                  type: string
                  maxLength: 5
                resultadoOrtografia:
                  type: string
                  maxLength: 5
                resultadoProcesoEvaluacion:
                  type: string
                  maxLength: 50
                fechaRevisionOfiEval:
                  type: string
                observacionesAnalista:
                  type: string
                consecutivoExpediente:
                  type: string
                  maxLength: 10
                seguimientoEvaluacionDesempenio:
                  type: boolean
                resultadoSeguimientoEvaluacionDesempenio:
                  type: string
                  maxLength: 10
                FKIdAcceso:
                  type: integer
                  nullable: true
                educacionFormal:
                  type: string
                avaladoPor:
                  type: string
                fechaAsignacionAnalista:
                  type: string
                capacitado:
                  type: boolean
                citaVirtual:
                  type: boolean
                atendioCita:
                  type: boolean
      responses:
        '200':
          description: Proceso de contratación actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: string
                    example: "Los datos han sido actualizados correctamente"
        '400':
          description: Algunos campos contienen errores
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 400
                  mensaje:
                    type: string
                    example: "Algunos campos contienen errores."
                  detalles:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                          example: "folio"
                        mensaje:
                          type: string
                          example: "El folio debe ser un texto válido"
        '404':
          description: Proceso no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 404
                  mensaje:
                    type: string
                    example: "El proceso no fue encontrado"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 500
                  mensaje:
                    type: string
                    example: "Ha ocurrido un error en el servidor"

