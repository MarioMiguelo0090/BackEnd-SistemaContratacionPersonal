  /proceso-contratacion/seguimiento-hermes:
    post:
      tags: [Seguimiento Hermes]
      summary: Registrar o actualizar seguimiento Hermes
      description: Registra o actualiza un arreglo de registros de seguimiento Hermes. El campo folio es requerido en cada registro. Requiere autenticación JWT mediante cookie access_token.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registros
              properties:
                registros:
                  type: array
                  description: Arreglo de registros de seguimiento Hermes. Debe contener al menos un elemento con folio válido.
                  items:
                    type: object
                    required:
                      - folio
                    properties:
                      folio:
                        type: string
                        description: Folio del seguimiento. Campo requerido y no puede estar vacío.
                        example: "HRM-2024-001"
                      fechaRecepcion:
                        type: string
                        description: Fecha de recepción.
                        example: "2024-01-15"
                      importancia:
                        type: string
                        description: Nivel de importancia.
                        example: "Alta"
                      tipoEnvio:
                        type: string
                        description: Tipo de envío.
                        example: "Correo"
                      requiereRespuesta:
                        type: boolean
                        description: Indica si requiere respuesta.
                        example: true
                      solicita:
                        type: string
                        description: Quien solicita.
                        example: "Dirección General"
                      entidadDependencia:
                        type: string
                        description: Entidad o dependencia.
                        example: "Secretaría de Salud"
                      asunto:
                        type: string
                        description: Asunto del seguimiento.
                        example: "Solicitud de información"
                      estatus:
                        type: string
                        description: Estatus del seguimiento.
                        example: "Pendiente"
                      acciones:
                        type: string
                        description: Acciones realizadas.
                        example: "En revisión"
      responses:
        '200':
          description: Seguimiento Hermes registrado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: string
                    example: "Los resultados se registraron correctamente"
        '400':
          description: Arreglo de registros inválido o vacío
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 400
                  mensaje:
                    type: string
                    example: "Debe enviar un arreglo de registros válido."
        '409':
          description: El folio del seguimiento Hermes ya fue registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 409
                  mensaje:
                    type: string
                    example: "Ya se ha registrado el frolio del seguimiento hermes ingresado."
        '500':
