
  /catalogo/tiposProceso:
    get:
      tags: [Catálogo]
      summary: Obtener tipos de proceso
      description: Retorna todos los tipos de proceso registrados. Requiere autenticación JWT mediante cookie access_token.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Lista de tipos de proceso obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  estado:
                    type: integer
                    example: 200
                  mensaje:
                    type: object
                    properties:
                      tiposProceso:
                        type: array
                        items:
                          type: object
                          properties:
                            idTipoProceso:
                              type: integer
                              example: 1
        '404':
          description: No se encontraron tipos de proceso
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 404
                  mensaje:
                    type: string
                    example: "No se han encontrado tipos de proceso registrados en la base de datos"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  estado:
                    type: integer
                    example: 500
                  mensaje:
                    type: string
                    example: "Ha ocurrido un error en el servidor"

